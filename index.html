    body:not(.panel-hidden) #btnPanel {

/* ============ 常量 / 工具 ============ */
const COLOR = { '室内':'#02419E', '室外':'#A6F333', '风雨棚':'#F59E0B', '室内+室外':'#7C3AED' };
const LS_KEY = 'nj_tennis_coords_v1';

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
function textW(s, size){ let w=0; for(const ch of String(s)){ w += /[\u4e00-\u9fa5，。、（）]/.test(ch) ? size : (ch.charCodeAt(0)>127 ? size*0.62 : size*0.56); } return w; }

/* 同一地址的几家（雨润大街17号等）做微小偏移，避免完全重叠 */
function jitter(posMap, idx){
  const key = DATA[idx].q;
  let k = 0;
  for (let j = 0; j < idx; j++) if (DATA[j].q === key) k++;
  if (!k) return null;
  const angle = k * 1.05, r = 0.00055;
  return { dLat: Math.cos(angle)*r, dLng: Math.sin(angle)*r };
}

function chipIcon(idx){
  const c = DATA[idx];
  const bg = COLOR[c.t], tc = (c.t === '室外') ? '#10330b' : '#ffffff';
  const l1 = c.n;
  const l2 = (c.c === null ? '片数待核' : c.c + '片' + (c.x ? ' · ' + c.x : '')) + ' · ' + c.t.replace('室内+室外','综合');
  const w = Math.ceil(Math.max(textW(l1,13), textW(l2,11))) + 18;
  const h = 34;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h+8}" viewBox="0 0 ${w} ${h+8}">` +
    `<rect x="1" y="1" width="${w-2}" height="${h}" rx="8" ry="8" fill="${bg}" stroke="#0b1a2b" stroke-width="1.2"/>` +
    `<path d="M${w/2-5} ${h-1} L${w/2} ${h+7} L${w/2+5} ${h-1} Z" fill="${bg}" stroke="#0b1a2b" stroke-width="1.2"/>` +
    `<text x="${w/2}" y="16" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" font-weight="600" fill="${tc}" text-anchor="middle">${esc(l1)}</text>` +
    `<text x="${w/2}" y="29" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="${tc}" text-anchor="middle">${esc(l2)}</text>` +
    `</svg>`;
  return { src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), w, h:h+8 };
}
function pinIcon(idx, only){
  const c = DATA[idx];
  const bg = COLOR[c.t];
  const dot = c.me && only ? '#D9F7A6' : '#ffffff';
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">` +
    `<path d="M13 0C6 0 0 6 0 13c0 9.6 13 21 13 21s13-11.4 13-21C26 6 20 0 13 0z" fill="${bg}" stroke="#0b1a2b" stroke-width="1.4"/>` +
    `<circle cx="13" cy="13" r="4.6" fill="${dot}"/></svg>`;
  return { src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg), w:26, h:34 };
}

/* ============ 地图 ============ */
let map, markerLayer, infoWin;
let showLabel = true;
let COORDS = {};            // idx -> {lat,lng}
let FAILED = [];

function initMap(){
  map = new TMap.Map('map', { zoom:11, center:new TMap.LatLng(32.06, 118.80), pitch:0, rotation:0 });
  infoWin = new TMap.InfoWindow({ map, position:new TMap.LatLng(32.06,118.80), offset:{x:0,y:-42}, enableCustom:true, content:'' });
  infoWin.close();
  run();
}

async function run(){
  COORDS = Object.assign({}, BAKED);          // 先用固化坐标，秒开
  const missing = DATA.map((_, i) => i).filter(i => !COORDS[i]);
  if (!missing.length){ setStatus(); renderAll(); hideLoading(); return; }
  await geocodeAll(missing);
  setStatus(); renderAll(); hideLoading();
}

async function geocodeAll(missing){
  const geo = new TMap.service.Geocoder();
  let done = 0;
  async function worker(list){
    for (const i of list){
      try{
        const r = await geo.getLocation({ address: DATA[i].q });
        const loc = r && r.result && r.result.location;
        if (loc && loc.lat) COORDS[i] = { lat: loc.lat, lng: loc.lng };
        else FAILED.push(i);
      }catch(e){ FAILED.push(i); }
      done++;
      document.getElementById('bar').style.width = Math.round(done/missing.length*100) + '%';
      document.getElementById('loadTxt').textContent = done + ' / ' + missing.length;
      await new Promise(r => setTimeout(r, 60));
    }
  }
  const N = 5, chunks = [];
  for (let i = 0; i < N; i++) chunks.push(missing.filter((_, k) => k % N === i));
  await Promise.all(chunks.map(worker));
}

function posOf(i){
  const o = COORDS[i]; if (!o) return null;
  const j = jitter(COORDS, i);
  return new TMap.LatLng(o.lat + (j?j.dLat:0), o.lng + (j?j.dLng:0));
}

function renderAll(){
  buildFilters(); renderList(); renderMarkers();
}

function visible(i){
  const fa = document.getElementById('fArea').value;
  const ft = document.getElementById('fType').value;
  if (fa && DATA[i].d !== fa) return false;
  if (ft && DATA[i].t !== ft) return false;
  return true;
}

function renderMarkers(){
  if (markerLayer) { markerLayer.setMap(null); markerLayer = null; }
  const styles = {}, geos = [];
  for (let i = 0; i < DATA.length; i++){
    if (!COORDS[i] || !visible(i)) continue;
    const ic = showLabel ? chipIcon(i) : pinIcon(i, true);
    styles['s' + i] = new TMap.MarkerStyle({ width: ic.w, height: ic.h, src: ic.src, anchor:{ x: ic.w/2, y: ic.h } });
    geos.push({ id: String(i), styleId:'s'+i, position: posOf(i) });
  }
  markerLayer = new TMap.MultiMarker({ map, styles, geometries: geos });
  markerLayer.on('click', e => {
    const i = Number(e.geometry.id);
    const c = DATA[i], p = posOf(i);
    infoWin.setPosition(p);
    infoWin.setContent(
      `<div class="iw"><h3>${esc(c.f)}</h3>` +
      `<p><span class="tag" style="background:${COLOR[c.t]};color:${c.t==='室外'?'#10330b':'#fff'}">${c.t}</span>` +
      `<b>${c.c === null ? '片数待核' : c.c + ' 片'}</b>${c.x ? ' + ' + esc(c.x) : ''}</p>` +
      `<p>📍 ${esc(c.d)} · ${esc(c.a)}</p>` +
      (c.p ? `<p>💰 ${esc(c.p)} 元/小时</p>` : '') +
      `<p>${c.s}</p></div>`
    );
    infoWin.open();
    map.easeTo({ center:p, zoom: Math.max(map.getZoom(), 14) }, { duration: 400 });
  });
  setStatus();
}

function buildFilters(){
  const fa = document.getElementById('fArea');
  if (fa.options.length <= 1){
    [...new Set(DATA.map(d => d.d))].forEach(d => {
      const o = document.createElement('option'); o.value = d; o.textContent = d; fa.appendChild(o);
    });
  }
}

function setStatus(){
  const n = Object.keys(COORDS).length;
  document.getElementById('status').innerHTML =
    `已标注 <b>${n}</b> / ${DATA.length} 家球场` +
    (FAILED.length ? `　·　<b>${FAILED.length}</b> 家坐标解析失败（列表标灰）` : '') +
    `　·　当前显示 <b>${countVisible()}</b> 家`;
}

function countVisible(){ let n=0; for (let i=0;i<DATA.length;i++) if (COORDS[i] && visible(i)) n++; return n; }

function renderList(){
  const box = document.getElementById('list'); box.innerHTML = '';
  const order = DATA.map((c,i)=>i).filter(i=>visible(i));
  order.sort((a,b) => (DATA[b].c||0) - (DATA[a].c||0));
  order.forEach(i => {
    const c = DATA[i];
    const el = document.createElement('div');
    el.className = 'item' + (c.me ? ' me' : '') + (COORDS[i] ? '' : ' fail');
    el.innerHTML = `<span class="dot" style="background:${COLOR[c.t]}"></span>` +
      `<span class="nm">${esc(c.n)}${c.me ? ' ⭐' : ''}</span>` +
      `<span class="meta">${c.c===null ? '待核' : c.c+'片'} · ${c.d}</span>`;
    el.onclick = () => {
      if (!COORDS[i]) return;
      map.easeTo({ center:posOf(i), zoom:15 }, { duration:400 });
      if (isMobile()) setPanel(true);       // 手机端点完自动收起，方便看图
    };
    box.appendChild(el);
  });
}

/* 缓存 */
function loadCache(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function saveCache(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function hideLoading(){ document.getElementById('loading').style.display = 'none'; }

/* 事件 */
document.getElementById('fArea').onchange = () => { renderMarkers(); renderList(); };
document.getElementById('fType').onchange = () => { renderMarkers(); renderList(); };
document.getElementById('btnLabel').onclick = e => {
  showLabel = !showLabel;
  e.target.textContent = showLabel ? '隐藏标签' : '显示标签';
  e.target.classList.toggle('primary', showLabel);
  renderMarkers();
};
document.getElementById('btnReset').onclick = () => map.easeTo({ center:new TMap.LatLng(32.06,118.80), zoom:11 }, { duration:400 });

/* 侧边栏折叠：手机端默认收起，点按钮/顶部横条可全屏看地图 */
const isMobile = () => window.matchMedia('(max-width: 820px)').matches;
const btnPanel = document.getElementById('btnPanel');
function setPanel(hidden){
  document.body.classList.toggle('panel-hidden', hidden);
  btnPanel.textContent = isMobile() ? (hidden ? '☰' : '✕') : (hidden ? '‹' : '›');
  btnPanel.title = hidden ? '展开面板' : '收起面板，全屏看地图';
  btnPanel.setAttribute('aria-label', btnPanel.title);
  setTimeout(() => { try{ if (map && map.resize) map.resize(); }catch(e){} }, 320);
}
btnPanel.onclick = () => setPanel(!document.body.classList.contains('panel-hidden'));
document.getElementById('grip').onclick = () => setPanel(true);
let lastNarrow = isMobile();
window.addEventListener('resize', () => {
  const narrow = isMobile();
  if (narrow !== lastNarrow){ lastNarrow = narrow; setPanel(narrow); }
  else setPanel(document.body.classList.contains('panel-hidden'));
});
setPanel(isMobile());
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(COORDS, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'nanjing-courts-coords.json'; a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      COORDS = JSON.parse(fr.result); saveCache(COORDS); FAILED = []; renderAll();
    }catch(e){ alert('文件格式不正确'); }
  };
  fr.readAsText(f);
};

window.addEventListener('load', () => {
  if (window.TMap) { initMap(); return; }
  setTimeout(() => {
    if (window.TMap) { initMap(); return; }
    document.getElementById('loading').innerHTML =
      '<div class="t">地图底图加载失败</div>' +
      '<div style="font-size:13px;color:#39414d;line-height:1.9;max-width:420px;text-align:center">' +
      '本页需要通过 WorkBuddy 的预览面板打开（地图代理地址由宿主环境注入）。<br>' +
      '直接双击文件用浏览器打开时，底图和标注都无法加载。</div>';
  }, 6000);
});
